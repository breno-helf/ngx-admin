<mat-card class="ds-card">
  <mat-card-header *ngIf="heading || subheading">
    <mat-card-title *ngIf="heading">{{ heading }}</mat-card-title>
    <mat-card-subtitle *ngIf="subheading">{{ subheading }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
