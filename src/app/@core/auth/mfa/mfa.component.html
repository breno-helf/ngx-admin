<h1 id="title" class="title">Two-factor authentication</h1>
<p class="sub-title">Enter the 6-digit passcode from your authenticator app to finish signing in.</p>

<nb-alert *ngIf="demoOtp" outline="info" role="alert">
  <span>Demo passcode: <strong>{{ demoOtp }}</strong></span>
</nb-alert>

<nb-alert *ngIf="errors?.length && !submitted" outline="danger" role="alert">
  <ul class="alert-message-list">
    <li *ngFor="let error of errors" class="alert-message">{{ error }}</li>
  </ul>
</nb-alert>

<nb-alert *ngIf="messages?.length && !submitted" outline="success" role="alert">
  <ul class="alert-message-list">
    <li *ngFor="let message of messages" class="alert-message">{{ message }}</li>
  </ul>
</nb-alert>

<form (ngSubmit)="verify()" #mfaForm="ngForm" aria-labelledby="title">
  <div class="form-control-group">
    <label class="label" for="input-otp">One-time passcode:</label>
    <input
      nbInput
      fullWidth
      [(ngModel)]="code"
      #otp="ngModel"
      name="otp"
      id="input-otp"
      inputmode="numeric"
      autocomplete="one-time-code"
      pattern="[0-9]{6}"
      placeholder="123456"
      fieldSize="large"
      required
      [status]="otp.dirty ? (otp.invalid ? 'danger' : 'success') : 'basic'"
    />
  </div>

  <button
    nbButton
    fullWidth
    status="primary"
    size="large"
    [disabled]="submitted || !mfaForm.valid"
    [class.btn-pulse]="submitted"
  >
    Verify
  </button>
</form>

<section class="another-action" aria-label="Back to login">
  <a class="text-link" routerLink="/auth/login">Back to sign in</a>
</section>
